<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">End-to-end MLOps lifecycle</text>
  <text x="470" y="54" text-anchor="middle" font-size="13" fill="#6b7280">From raw text to a served, gated, versioned model</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="30" y="90" width="150" height="86" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="105" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Raw data</text>
  <text x="105" y="141" text-anchor="middle" font-size="11" fill="#4b5563">reviews.csv or</text>
  <text x="105" y="157" text-anchor="middle" font-size="11" fill="#4b5563">synthetic demo set</text>

  <line x1="180" y1="133" x2="206" y2="133" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="210" y="90" width="180" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="300" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">Data pipeline</text>
  <text x="300" y="136" text-anchor="middle" font-size="11" fill="#374151">validate: nulls, duplicates,</text>
  <text x="300" y="151" text-anchor="middle" font-size="11" fill="#374151">class balance, drift (KS + PSI)</text>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#6b7280">SHA-256 manifest per version</text>

  <line x1="390" y1="133" x2="416" y2="133" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="420" y="90" width="170" height="86" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Feature store</text>
  <text x="505" y="136" text-anchor="middle" font-size="11" fill="#374151">TF-IDF vectors, cached</text>
  <text x="505" y="151" text-anchor="middle" font-size="11" fill="#374151">transformers reused at</text>
  <text x="505" y="166" text-anchor="middle" font-size="11" fill="#374151">train and serve time</text>

  <line x1="590" y1="133" x2="616" y2="133" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="620" y="90" width="180" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="710" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Training</text>
  <text x="710" y="136" text-anchor="middle" font-size="11" fill="#374151">logistic regression / random</text>
  <text x="710" y="151" text-anchor="middle" font-size="11" fill="#374151">forest / SVM, stratified CV</text>
  <text x="710" y="168" text-anchor="middle" font-size="11" fill="#6b7280">params + metrics → MLflow</text>

  <!-- down arrow to row 2 -->
  <line x1="710" y1="176" x2="710" y2="216" stroke="#374151" stroke-width="1.8"/>
  <line x1="710" y1="216" x2="300" y2="216" stroke="#374151" stroke-width="1.8" fill="none"/>
  <line x1="300" y1="216" x2="300" y2="246" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <!-- Row 2 -->
  <rect x="210" y="250" width="180" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Evaluation</text>
  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#374151">accuracy, F1, ROC-AUC,</text>
  <text x="300" y="311" text-anchor="middle" font-size="11" fill="#374151">confusion matrix, report</text>
  <text x="300" y="328" text-anchor="middle" font-size="11" fill="#6b7280">written to results/</text>

  <line x1="390" y1="293" x2="416" y2="293" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <!-- Gate diamond -->
  <polygon points="505,246 590,293 505,340 420,293" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="505" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">Quality gate</text>
  <text x="505" y="306" text-anchor="middle" font-size="10" fill="#854d0e">min accuracy met?</text>
  <text x="505" y="360" text-anchor="middle" font-size="11" fill="#b91c1c">fail → run rejected (no promotion)</text>

  <line x1="590" y1="293" x2="616" y2="293" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="603" y="282" text-anchor="middle" font-size="11" fill="#166534">pass</text>

  <rect x="620" y="250" width="180" height="86" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="710" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">Model registry</text>
  <text x="710" y="296" text-anchor="middle" font-size="11" fill="#374151">versioned storage with</text>
  <text x="710" y="311" text-anchor="middle" font-size="11" fill="#374151">stage transitions:</text>
  <text x="710" y="328" text-anchor="middle" font-size="11" fill="#6b7280">none → staging → production</text>

  <!-- Serve + Docker strip -->
  <line x1="710" y1="336" x2="710" y2="382" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <rect x="420" y="386" width="290" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">FastAPI serving (production stage)</text>
  <text x="565" y="430" text-anchor="middle" font-size="11" fill="#374151">/predict · /predict/batch · /health — latency + prediction logging</text>

  <rect x="740" y="386" width="170" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="825" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Docker</text>
  <text x="825" y="430" text-anchor="middle" font-size="11" fill="#4b5563">image + compose</text>

  <line x1="710" y1="417" x2="736" y2="417" stroke="#374151" stroke-width="1.8" marker-end="url(#a3)"/>

  <!-- CI strip -->
  <rect x="30" y="386" width="360" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="210" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">Continuous integration</text>
  <text x="210" y="430" text-anchor="middle" font-size="11" fill="#374151">GitHub Actions runs the pytest suite on every push and PR</text>
</svg>
